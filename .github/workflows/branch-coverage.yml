
name: Lab 6 - Branch Coverage

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  branch-coverage:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Lab 6

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest coverage

      - name: Run branch coverage tests
        run: |
          coverage run --branch --source=pet_walking_service -m pytest BranchCoverageTest_PES2UG24CS259_application.py -v

      - name: Display branch coverage report
        run: |
          coverage report --branch -m
